services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: steady
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: steady
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steady"]
      interval: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://steady:${POSTGRES_PASSWORD}@db:5432/steady
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      OWNER_EMAIL: ${OWNER_EMAIL:?defina OWNER_EMAIL no .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?defina OWNER_PASSWORD no .env}
      APP_ENV: ${APP_ENV:-development}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
